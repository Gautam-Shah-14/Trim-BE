# Nightly logical backup of the database (free Supabase has no backups). Needs secret DATABASE_URL.
# Optional secret BACKUP_PASSPHRASE: when set the dump is encrypted with gpg before upload.
# The artifact contains personal data - keep the repository private and restrict who can read Actions artifacts.
name: backup
on:
  schedule:
    - cron: '37 20 * * *'
  workflow_dispatch:

jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Install a recent pg_dump
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -y && sudo apt-get install -y postgresql-client-17
      - name: pg_dump
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          test -n "$DATABASE_URL" || { echo "DATABASE_URL secret missing"; exit 1; }
          stamp=$(date -u +%Y%m%dT%H%M%SZ)
          /usr/lib/postgresql/17/bin/pg_dump "$DATABASE_URL" --no-owner --no-privileges --format=custom --file "trim-$stamp.dump"
          if [ -n "$BACKUP_PASSPHRASE" ]; then
            gpg --batch --yes --passphrase "$BACKUP_PASSPHRASE" --symmetric --cipher-algo AES256 -o "trim-$stamp.dump.gpg" "trim-$stamp.dump"
            rm "trim-$stamp.dump"
          fi
          ls -l trim-*
      - uses: actions/upload-artifact@v4
        with:
          name: trim-db-backup
          path: trim-*
          retention-days: 14
