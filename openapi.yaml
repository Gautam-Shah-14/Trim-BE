openapi: 3.1.0
info:
  title: Trim API
  version: 0.1.0
  description: "REST API of the Trim salon platform. Success: `{data, meta?}`. Error: `{error:{code,message,details?}}`. Money = integer paise; times = ISO-8601 UTC; phones = E.164. GENERATED from the route registry by `npm run openapi` - do not edit by hand."
servers:
  - url: /v1
security:
  - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              enum:
                - VALIDATION_FAILED
                - UNAUTHENTICATED
                - FORBIDDEN
                - NOT_FOUND
                - CONFLICT
                - SLOT_TAKEN
                - HOLD_EXPIRED
                - ALREADY_CHECKED_IN
                - VERSION_MISMATCH
                - OUT_OF_WINDOW
                - PLAN_LIMIT
                - SUBSCRIPTION_INACTIVE
                - RATE_LIMITED
                - INTERNAL
            message: &a1
              type: string
            details:
              description: Array of {field, issue} for VALIDATION_FAILED; object (e.g. {limit}) for PLAN_LIMIT
              oneOf:
                - type: array
                  items:
                    type: object
                    properties:
                      field: *a1
                      issue: *a1
                - type: object
            reason:
              type: string
              description: Machine-readable sub-reason for generic CONFLICT/FORBIDDEN, e.g. CANCEL_CUTOFF, QR_OUTDATED, WRONG_SALON
          required:
            - code
            - message
      required:
        - error
    User:
      type: object
      properties:
        id: &a2
          type: string
          format: uuid
        fullName: *a1
        phone:
          type:
            - string
            - "null"
        email:
          type:
            - string
            - "null"
        role:
          type: string
          enum:
            - customer
            - salon_user
            - admin
            - sales_agent
        avatarMediaId:
          type:
            - string
            - "null"
        mustChangePassword:
          type: boolean
    Membership:
      type: object
      properties:
        salonId: *a2
        salonName: *a1
        salonStatus: *a1
        staffId: *a2
        roleId: *a2
        roleName: *a1
        permissions:
          type: array
          items: *a1
        planCode: *a1
        subscriptionStatus: *a1
        readOnly:
          type: boolean
        desktopAccess:
          type: boolean
    AuthTokens:
      type: object
      properties:
        accessToken: *a1
        refreshToken: *a1
        expiresIn: &a3
          type: integer
    AuthResult:
      type: object
      properties:
        accessToken: *a1
        refreshToken: *a1
        expiresIn: *a3
        user:
          $ref: "#/components/schemas/User"
        memberships:
          type: array
          items:
            $ref: "#/components/schemas/Membership"
        salon:
          type: object
          properties:
            id: *a2
            name: *a1
            status: *a1
    Booking:
      type: object
      properties:
        id: *a2
        salonId: *a2
        salonName: *a1
        customerId:
          type:
            - string
            - "null"
        customerName: *a1
        customerPhone:
          type:
            - string
            - "null"
        staffId: *a2
        staffName: *a1
        source:
          enum:
            - app
            - walk_in
        status:
          enum:
            - held
            - confirmed
            - checked_in
            - completed
            - cancelled
            - no_show
            - expired
        startsAt: &a4
          type: string
          format: date-time
        endsAt: *a4
        totalDurationMin: *a3
        totalPricePaise: *a3
        holdExpiresAt:
          type:
            - string
            - "null"
          format: date-time
        version: *a3
        cancelledReason:
          type:
            - string
            - "null"
        items:
          type: array
          items:
            type: object
            properties:
              serviceId: *a2
              name: *a1
              durationMin: *a3
              pricePaise: *a3
        hasReview:
          type: boolean
        qrToken:
          type: string
          description: Only on customer GET/confirm while status=confirmed
        createdAt: *a4
    Invoice:
      type: object
      properties:
        id: *a2
        salonId: *a2
        bookingId:
          type:
            - string
            - "null"
        invoiceNo: *a1
        customerName: *a1
        customerPhone:
          type:
            - string
            - "null"
        subtotalPaise: *a3
        discountPaise: *a3
        taxPaise: *a3
        taxLabel:
          type:
            - string
            - "null"
        totalPaise: *a3
        status:
          enum:
            - draft
            - paid
            - void
        items:
          type: array
          items:
            type: object
            properties:
              serviceId:
                type:
                  - string
                  - "null"
              name: *a1
              qty: *a3
              unitPricePaise: *a3
              lineTotalPaise: *a3
        payments:
          type: array
          items:
            type: object
            properties:
              methodCode: *a1
              amountPaise: *a3
              reference:
                type:
                  - string
                  - "null"
              paidAt: *a4
        createdAt: *a4
    Plan:
      type: object
      properties:
        code: *a1
        name: *a1
        priceMonthlyPaise: *a3
        priceAnnualPaise: *a3
        maxBranches:
          type:
            - integer
            - "null"
        maxStaff:
          type:
            - integer
            - "null"
        customRoles:
          type: boolean
        desktopAccess:
          type: boolean
        analyticsLevel:
          enum:
            - basic
            - full
        csvExport:
          type: boolean
        billTemplates:
          type: boolean
        trialDays: *a3
    Availability:
      type: object
      properties:
        date: *a1
        timezone: *a1
        slots:
          type: array
          items:
            type: object
            properties:
              staffId: *a2
              startsAt: *a4
              endsAt: *a4
    CheckoutResult:
      type: object
      properties:
        razorpaySubscriptionId: *a1
        keyId: *a1
    MediaId:
      type: object
      properties:
        id: *a2
    Hairstyle:
      type: object
      additionalProperties: true
      description: See spec §6 for the shape of Hairstyle
    ServiceTemplate:
      type: object
      additionalProperties: true
      description: See spec §6 for the shape of ServiceTemplate
    Permission:
      type: object
      additionalProperties: true
      description: See spec §6 for the shape of Permission
    MeResult:
      type: object
      additionalProperties: true
      description: See spec §6 for the shape of MeResult
    SalonSummary:
      type: object
      additionalProperties: true
      description: See spec §6 for the shape of SalonSummary
    SalonDetail:
      type: object
      additionalProperties: true
      description: See spec §6 for the shape of SalonDetail
    Review:
      type: object
      additionalProperties: true
      description: See spec §6 for the shape of Review
    Salon:
      type: object
      additionalProperties: true
      description: See spec §6 for the shape of Salon
    Hours:
      type: object
      additionalProperties: true
      description: See spec §6 for the shape of Hours
    Closure:
      type: object
      additionalProperties: true
      description: See spec §6 for the shape of Closure
    Service:
      type: object
      additionalProperties: true
      description: See spec §6 for the shape of Service
    ServiceIds:
      type: object
      additionalProperties: true
      description: See spec §6 for the shape of ServiceIds
    Staff:
      type: object
      additionalProperties: true
      description: See spec §6 for the shape of Staff
    StaffHours:
      type: object
      additionalProperties: true
      description: See spec §6 for the shape of StaffHours
    TimeOff:
      type: object
      additionalProperties: true
      description: See spec §6 for the shape of TimeOff
    Role:
      type: object
      additionalProperties: true
      description: See spec §6 for the shape of Role
    PaymentMethod:
      type: object
      additionalProperties: true
      description: See spec §6 for the shape of PaymentMethod
    AnalyticsSummary:
      type: object
      additionalProperties: true
      description: See spec §6 for the shape of AnalyticsSummary
    Customer:
      type: object
      additionalProperties: true
      description: See spec §6 for the shape of Customer
    CustomerDetail:
      type: object
      additionalProperties: true
      description: See spec §6 for the shape of CustomerDetail
    SubscriptionView:
      type: object
      additionalProperties: true
      description: See spec §6 for the shape of SubscriptionView
    Receipt:
      type: object
      additionalProperties: true
      description: See spec §6 for the shape of Receipt
    AdminSalon:
      type: object
      additionalProperties: true
      description: See spec §6 for the shape of AdminSalon
    ContactMessage:
      type: object
      additionalProperties: true
      description: See spec §6 for the shape of ContactMessage
    AdminUser:
      type: object
      additionalProperties: true
      description: See spec §6 for the shape of AdminUser
    AdminStats:
      type: object
      additionalProperties: true
      description: See spec §6 for the shape of AdminStats
    AuditEntry:
      type: object
      additionalProperties: true
      description: See spec §6 for the shape of AuditEntry
    Lead:
      type: object
      additionalProperties: true
      description: See spec §6 for the shape of Lead
    Invite:
      type: object
      additionalProperties: true
      description: See spec §6 for the shape of Invite
    Pipeline:
      type: object
      additionalProperties: true
      description: See spec §6 for the shape of Pipeline
paths:
  /plans:
    get:
      tags:
        - Public
      summary: Public plans and prices
      operationId: get_plans
      parameters: []
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Plan"
                  meta:
                    type: object
                    description: "Pagination: limit, nextCursor"
                required:
                  - data
        default: &a5
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      security: []
  /contact:
    post:
      tags:
        - Public
      summary: Website contact form
      description: Honeypot field `website` must be empty; bots get a silent 201
      operationId: post_contact
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 120
                email:
                  type: string
                  maxLength: 254
                  format: email
                  pattern: ^(?:[A-Za-z0-9_'+\-]+\.)*[A-Za-z0-9_'+\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$
                phone:
                  type: string
                  pattern: ^\+[1-9]\d{7,14}$
                salonName:
                  type: string
                  maxLength: 120
                message:
                  type: string
                  minLength: 5
                  maxLength: 4000
                website:
                  type: string
                  maxLength: 500
              required:
                - name
                - email
                - message
              additionalProperties: false
      responses:
        "201":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                  meta:
                    type: object
                    description: "Pagination: limit, nextCursor"
                required:
                  - data
        default: *a5
      security: []
  /hairstyles:
    get:
      tags:
        - Hairstyles
      summary: Hairstyle catalog
      operationId: get_hairstyles
      parameters:
        - name: faceShape
          in: query
          required: false
          schema:
            type: string
        - name: audience
          in: query
          required: false
          schema:
            type: string
            enum:
              - men
              - women
              - unisex
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Hairstyle"
                  meta:
                    type: object
                    description: "Pagination: limit, nextCursor"
                required:
                  - data
        default: *a5
      security: []
  /hairstyles/{id}:
    get:
      tags:
        - Hairstyles
      summary: One hairstyle
      operationId: get_hairstyles_id
      parameters:
        - name: id
          in: path
          required: true
          schema: *a2
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Hairstyle"
                  meta:
                    type: object
                    description: "Pagination: limit, nextCursor"
                required:
                  - data
        default: *a5
      security: []
  /service-templates:
    get:
      tags:
        - Services
      summary: Starter service catalog
      operationId: get_service_templates
      parameters: []
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/ServiceTemplate"
                  meta:
                    type: object
                    description: "Pagination: limit, nextCursor"
                required:
                  - data
        default: *a5
  /permissions:
    get:
      tags:
        - Roles
      summary: All permission keys
      operationId: get_permissions
      parameters: []
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Permission"
                  meta:
                    type: object
                    description: "Pagination: limit, nextCursor"
                required:
                  - data
        default: *a5
  /invites/{code}:
    get:
      tags:
        - Public
      summary: Look up a sales invite (prefills the register page)
      operationId: get_invites_code
      parameters:
        - name: code
          in: path
          required: true
          schema: *a1
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                  meta:
                    type: object
                    description: "Pagination: limit, nextCursor"
                required:
                  - data
        default: *a5
      security: []
  /auth/register:
    post:
      tags:
        - Auth
      summary: Customer sign-up
      operationId: post_auth_register
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                fullName:
                  type: string
                  minLength: 1
                  maxLength: 120
                phone:
                  type: string
                  pattern: ^\+[1-9]\d{7,14}$
                email:
                  type: string
                  maxLength: 254
                  format: email
                  pattern: ^(?:[A-Za-z0-9_'+\-]+\.)*[A-Za-z0-9_'+\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$
                password:
                  type: string
                  pattern: ^(?=.*[A-Za-z])(?=.*\d).{8,128}$
                deviceLabel:
                  type: string
                  maxLength: 100
                client:
                  type: string
                  enum:
                    - customer_app
                    - salon_app
                    - desktop
                    - website
              required:
                - fullName
                - password
              additionalProperties: false
      responses:
        "201":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/AuthResult"
                  meta:
                    type: object
                    description: "Pagination: limit, nextCursor"
                required:
                  - data
        default: *a5
      security: []
  /auth/register-owner:
    post:
      tags:
        - Auth
      summary: Register a salon owner (creates pending salon + 14-day Pro trial)
      operationId: post_auth_register_owner
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                fullName:
                  type: string
                  minLength: 1
                  maxLength: 120
                phone:
                  type: string
                  pattern: ^\+[1-9]\d{7,14}$
                email:
                  type: string
                  maxLength: 254
                  format: email
                  pattern: ^(?:[A-Za-z0-9_'+\-]+\.)*[A-Za-z0-9_'+\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$
                password:
                  type: string
                  pattern: ^(?=.*[A-Za-z])(?=.*\d).{8,128}$
                inviteCode:
                  type: string
                  maxLength: 64
                salon:
                  type: object
                  properties:
                    name:
                      type: string
                      minLength: 1
                      maxLength: 120
                    city:
                      type: string
                      maxLength: 80
                    state:
                      type: string
                      maxLength: 80
                    addressLine:
                      type: string
                      maxLength: 200
                    pincode:
                      type: string
                      maxLength: 12
                    phone:
                      type: string
                      pattern: ^\+[1-9]\d{7,14}$
                    lat:
                      type: number
                      minimum: -90
                      maximum: 90
                    lng:
                      type: number
                      minimum: -180
                      maximum: 180
                    timezone:
                      type: string
                    description:
                      type: string
                      maxLength: 1000
                  required:
                    - name
                  additionalProperties: false
              required:
                - fullName
                - phone
                - email
                - password
                - salon
              additionalProperties: false
      responses:
        "201":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/AuthResult"
                  meta:
                    type: object
                    description: "Pagination: limit, nextCursor"
                required:
                  - data
        default: *a5
      security: []
  /auth/login:
    post:
      tags:
        - Auth
      summary: Log in with phone/email + password
      description: client=desktop requires the desktop_access entitlement (403 PLAN_LIMIT)
      operationId: post_auth_login
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                identifier:
                  type: string
                  minLength: 1
                  maxLength: 254
                password:
                  type: string
                  minLength: 1
                  maxLength: 128
                deviceLabel:
                  type: string
                  maxLength: 100
                client:
                  type: string
                  enum:
                    - customer_app
                    - salon_app
                    - desktop
                    - website
              required:
                - identifier
                - password
                - client
              additionalProperties: false
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/AuthResult"
                  meta:
                    type: object
                    description: "Pagination: limit, nextCursor"
                required:
                  - data
        default: *a5
      security: []
  /auth/refresh:
    post:
      tags:
        - Auth
      summary: Rotate the refresh token
      description: Reusing an already-rotated token revokes the whole session family
      operationId: post_auth_refresh
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken:
                  type: string
                  minLength: 20
                  maxLength: 200
              required:
                - refreshToken
              additionalProperties: false
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/AuthTokens"
                  meta:
                    type: object
                    description: "Pagination: limit, nextCursor"
                required:
                  - data
        default: *a5
      security: []
  /auth/logout:
    post:
      tags:
        - Auth
      summary: Revoke the current session
      operationId: post_auth_logout
      parameters: []
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                  meta:
                    type: object
                    description: "Pagination: limit, nextCursor"
                required:
                  - data
        default: *a5
  /auth/logout-all:
    post:
      tags:
        - Auth
      summary: Revoke every session of the user
      operationId: post_auth_logout_all
      parameters: []
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                  meta:
                    type: object
                    description: "Pagination: limit, nextCursor"
                required:
                  - data
        default: *a5
  /auth/change-password:
    post:
      tags:
        - Auth
      summary: Change password (revokes other sessions)
      operationId: post_auth_change_password
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                currentPassword:
                  type: string
                  minLength: 1
                  maxLength: 128
                newPassword:
                  type: string
                  pattern: ^(?=.*[A-Za-z])(?=.*\d).{8,128}$
              required:
                - currentPassword
                - newPassword
              additionalProperties: false
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                  meta:
                    type: object
                    description: "Pagination: limit, nextCursor"
                required:
                  - data
        default: *a5
  /me:
    get:
      tags:
        - Profile
      summary: Current user profile and salon memberships
      operationId: get_me
      parameters: []
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/MeResult"
                  meta:
                    type: object
                    description: "Pagination: limit, nextCursor"
                required:
                  - data
        default: *a5
    patch:
      tags:
        - Profile
      summary: Update profile (name, avatar via media id)
      operationId: patch_me
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                fullName:
                  type: string
                  minLength: 1
                  maxLength: 120
                avatarMediaId:
                  anyOf:
                    - type: string
                      format: uuid
                      pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                    - type: "null"
              additionalProperties: false
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/User"
                  meta:
                    type: object
                    description: "Pagination: limit, nextCursor"
                required:
                  - data
        default: *a5
    delete:
      tags:
        - Profile
      summary: Delete (anonymise) a customer account
      operationId: delete_me
      parameters: []
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                  meta:
                    type: object
                    description: "Pagination: limit, nextCursor"
                required:
                  - data
        default: *a5
  /me/device-token:
    post:
      tags:
        - Profile
      summary: Store an FCM device token
      operationId: post_me_device_token
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
                  minLength: 1
                  maxLength: 4096
                platform:
                  default: android
                  type: string
                  enum:
                    - android
                    - ios
                    - web
              required:
                - token
              additionalProperties: false
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
