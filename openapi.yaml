          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 120
                description:
                  anyOf:
                    - type: string
                      maxLength: 2000
                    - type: "null"
                phone:
                  anyOf:
                    - type: string
                      pattern: ^\+[1-9]\d{7,14}$
                    - type: "null"
                addressLine:
                  anyOf:
                    - type: string
                      maxLength: 200
                    - type: "null"
                city:
                  anyOf:
                    - type: string
                      maxLength: 80
                    - type: "null"
                state:
                  anyOf:
                    - type: string
                      maxLength: 80
                    - type: "null"
                pincode:
                  anyOf:
                    - type: string
                      maxLength: 12
                    - type: "null"
                lat:
                  anyOf:
                    - type: number
                      minimum: -90
                      maximum: 90
                    - type: "null"
                lng:
                  anyOf:
                    - type: number
                      minimum: -180
                      maximum: 180
                    - type: "null"
                timezone:
                  type: string
                logoMediaId:
                  anyOf:
                    - type: string
                      format: uuid
                      pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                    - type: "null"
                brandColor:
                  anyOf:
                    - type: string
                      pattern: ^#[0-9A-Fa-f]{6}$
                    - type: "null"
                billFooter:
                  anyOf:
                    - type: string
                      maxLength: 500
                    - type: "null"
                gstin:
                  anyOf:
                    - type: string
                      pattern: ^\d{2}[A-Z]{5}\d{4}[A-Z][1-9A-Z]Z[0-9A-Z]$
                    - type: "null"
                gstEnabled:
                  type: boolean
                invoicePrefix:
                  type: string
                  pattern: ^[A-Z0-9]{2,6}$
                cancelCutoffMin:
                  type: integer
                  minimum: 0
                  maximum: 10080
              additionalProperties: false
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Salon"
