                      - unitPricePaise
                    additionalProperties: false
                discountPaise:
                  default: 0
                  type: integer
                  minimum: 0
                  maximum: 10000000
                taxRatePct:
                  type: number
                  minimum: 0
                  maximum: 40
                payments:
                  default: []
                  maxItems: 10
                  type: array
                  items:
                    type: object
                    properties:
                      methodCode:
                        type: string
                        enum:
                          - cash
                          - card
                          - upi
                          - wallet
                          - bank_transfer
                          - other
                      amountPaise:
                        type: integer
                        minimum: 1
                        maximum: 200000000
                      reference:
                        type: string
                        maxLength: 100
                    required:
                      - methodCode
                      - amountPaise
                    additionalProperties: false
              required:
                - items
              additionalProperties: false
