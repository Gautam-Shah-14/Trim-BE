                - OVERLOADED
                - UPSTREAM_ERROR
                - METHOD_NOT_ALLOWED
                - TIMEOUT
                - INTERNAL
            message:
              type: string
            details:
              description: Array of {field, issue} for VALIDATION_FAILED; object (e.g. {limit}) for PLAN_LIMIT
              oneOf:
                - type: array
                  items:
                    type: object
                    properties:
                      field:
                        type: string
                      issue:
                        type: string
                - type: object
            reason:
              type: string
              description: Stable machine-readable sub-reason for CONFLICT/FORBIDDEN (see x-error-reasons). For a missing salon permission it is the permission key, e.g. billing.void.
