        - Subscription
      summary: Create a Razorpay subscription for Checkout
      description: Requires salon permission `settings.edit`. Salon owner only. The client opens Razorpay Checkout with the returned id/key, then polls GET subscription. The webhook is the source of truth.
      operationId: post_salons_salonId_subscription_checkout
      parameters:
        - name: salonId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
            minLength: 8
            maxLength: 128
          description: Same key + same body replays the first response; same key + different body is 422.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                planCode:
                  type: string
                  enum:
                    - starter
                    - pro
                interval:
                  type: string
                  enum:
                    - monthly
                    - annual
              required:
                - planCode
                - interval
              additionalProperties: false
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/CheckoutResult"
                  meta:
                    type: object
                    description: "Pagination: limit, nextCursor"
                required:
                  - data
        default:
          description: Error
          content:
            application/json:
              schema:
